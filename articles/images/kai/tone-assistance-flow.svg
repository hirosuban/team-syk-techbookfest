<svg xmlns="http://www.w3.org/2000/svg" width="620" height="405" viewBox="0 0 620 405" role="img" aria-labelledby="title desc">
  <title id="title">システムを利用するときの流れ</title>
  <desc id="desc">作者が原稿と仕上げ指示を渡し、システムが仕上げ案を作る。作者が原稿と比較し、修正が必要なら追加の指示を返す。採用した仕上がりを制作ソフトへ戻す。</desc>
  <style>text { font-family: "Noto Sans CJK JP", sans-serif; fill: #222; text-anchor: middle; } .label { font-size: 17px; } .role { font-size: 21px; font-weight: 700; } .body { font-size: 18px; } .arrow { fill: none; stroke: #555; stroke-width: 1.8; marker-end: url(#arrow); } .both { marker-start: url(#arrow); }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
    </marker>
  </defs>
  <rect width="620" height="405" fill="white" />
  <rect x="25" y="15" width="470" height="72" rx="8" fill="#eee" stroke="#777" stroke-width="1.6" />
  <text x="260.0" y="44" class="role">作者</text>
  <text x="260.0" y="72" class="body">原稿と仕上げの指示を渡す</text>
  <path d="M 260 89 V 113" class="arrow" />
  <rect x="25" y="115" width="470" height="72" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="260.0" y="144" class="role">システム</text>
  <text x="260.0" y="172" class="body">指示に沿って仕上げ案を作る</text>
  <path d="M 260 189 V 213" class="arrow" />
  <rect x="25" y="215" width="470" height="72" rx="8" fill="#eee" stroke="#777" stroke-width="1.6" />
  <text x="260.0" y="244" class="role">作者</text>
  <text x="260.0" y="272" class="body">原稿と仕上がりを見比べる</text>
  <path d="M 260 289 V 313" class="arrow" />
  <rect x="25" y="315" width="470" height="72" rx="8" fill="#eee" stroke="#777" stroke-width="1.6" />
  <text x="260.0" y="344" class="role">制作へ戻す</text>
  <text x="260.0" y="372" class="body">採用した仕上がりを制作ソフトへ</text>
  <path d="M 497 251 H 605 V 151 H 497" class="arrow" stroke-dasharray="6 4" />
  <text x="556" y="190" class="label">修正の</text>
  <text x="556" y="214" class="label">追加指示</text>
</svg>
