<svg xmlns="http://www.w3.org/2000/svg" width="780" height="710" viewBox="0 0 780 710" role="img" aria-labelledby="title desc">
  <title id="title">2つの入力とSKILLによる仕上げ・原寸比較</title>
  <desc id="desc">文字起こしした指示はAIが読み取り、原稿とリファレンスはAIがプロンプトへ変換する。どちらもSKILLに従って対象を指定して生成し、原稿・マスク・仕上げの原寸比較と修正を繰り返す。結果を作者が確認して採用する。</desc>
  <style>text { font-family: "Noto Sans CJK JP", sans-serif; fill: #222; text-anchor: middle; } .label { font-size: 17px; } .role { font-size: 21px; font-weight: 700; } .body { font-size: 18px; } .arrow { fill: none; stroke: #555; stroke-width: 1.8; marker-end: url(#arrow); } .both { marker-start: url(#arrow); }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
    </marker>
  </defs>
  <rect width="780" height="710" fill="white" />
  <rect x="25" y="15" width="330" height="75" rx="8" fill="#eee" stroke="#777" stroke-width="1.6" />
  <text x="190.0" y="44" class="role">口頭の指示</text>
  <text x="190.0" y="72" class="body">話した内容を文字起こしする</text>
  <rect x="425" y="15" width="330" height="75" rx="8" fill="#eee" stroke="#777" stroke-width="1.6" />
  <text x="590.0" y="44" class="role">リファレンス画像</text>
  <text x="590.0" y="72" class="body">原稿と完成見本を渡す</text>
  <rect x="25" y="135" width="330" height="75" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="190.0" y="164" class="role">AI</text>
  <text x="190.0" y="192" class="body">文字起こしした指示を読む</text>
  <rect x="425" y="135" width="330" height="75" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="590.0" y="164" class="role">AI</text>
  <text x="590.0" y="192" class="body">原稿と見本から指示を作る</text>
  <path d="M 190 92 V 133" class="arrow" />
  <path d="M 590 92 V 133" class="arrow" />
  <path d="M 190 212 V 250 H 590 V 212" fill="none" stroke="#555" stroke-width="1.8" />
  <path d="M 390 250 V 283" class="arrow" />
  <rect x="170" y="285" width="440" height="75" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="390.0" y="314" class="role">トーンを貼る</text>
  <text x="390.0" y="342" class="body">SKILLに従って範囲を指定・生成</text>
  <rect x="170" y="395" width="440" height="75" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="390.0" y="424" class="role">AIが原寸比較する</text>
  <text x="390.0" y="452" class="body">原稿・マスク・仕上げを照合</text>
  <rect x="170" y="505" width="440" height="75" rx="8" fill="#eee" stroke="#777" stroke-width="1.6" />
  <text x="390.0" y="534" class="role">作者が確認する</text>
  <text x="390.0" y="562" class="body">原稿と仕上がりを見比べる</text>
  <rect x="170" y="615" width="440" height="75" rx="8" fill="#eee" stroke="#777" stroke-width="1.6" />
  <text x="390.0" y="644" class="role">制作へ戻す</text>
  <text x="390.0" y="672" class="body">採用した仕上がりを制作ソフトへ</text>
  <path d="M 390 362 V 393" class="arrow" />
  <path d="M 390 472 V 503" class="arrow" />
  <path d="M 390 582 V 613" class="arrow" />
  <path d="M 168 432 H 70 V 322 H 168" class="arrow" stroke-dasharray="6 4" />
  <text x="116" y="369" class="label">修正</text>
  <text x="116" y="393" class="label">再生成</text>
  <path d="M 612 542 H 745 V 322 H 612" class="arrow" stroke-dasharray="6 4" />
  <text x="680" y="475" class="label">作者の</text>
  <text x="680" y="499" class="label">追加指示</text>
</svg>
