<svg xmlns="http://www.w3.org/2000/svg" width="920" height="750" viewBox="0 0 920 750" role="img" aria-labelledby="title desc">
  <title id="title">SKILLを使うトーン貼り補助システム</title>
  <desc id="desc">原稿と文章の指示またはリファレンスを受け取る。作業制御が3本のSKILLを読み込んでCodexへ渡し、見本からの指示作成、対象指定、画像処理による生成、原寸比較と修正を進める。</desc>
  <style>text { font-family: "Noto Sans CJK JP", sans-serif; fill: #222; text-anchor: middle; } .label { font-size: 17px; } .role { font-size: 21px; font-weight: 700; } .body { font-size: 18px; } .arrow { fill: none; stroke: #555; stroke-width: 1.8; marker-end: url(#arrow); } .both { marker-start: url(#arrow); }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
    </marker>
  </defs>
  <rect width="920" height="750" fill="white" />
  <rect x="20" y="105" width="600" height="625" rx="12" fill="#f5f5f5" stroke="#999" stroke-width="1.6" />
  <text x="40" y="131" class="label" style="text-anchor: start">手元のアプリ</text>
  <rect x="140" y="15" width="300" height="55" rx="8" fill="#e7e7e7" stroke="#777" stroke-width="1.6" />
  <text x="290.0" y="44" class="role">作者</text>
  <rect x="55" y="150" width="530" height="75" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="320.0" y="179" class="role">作者の画面</text>
  <text x="320.0" y="207" class="body">原稿・指示・見本の入力と結果表示</text>
  <rect x="55" y="285" width="330" height="75" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="220.0" y="314" class="role">AIの作業制御</text>
  <text x="220.0" y="342" class="body">依頼と作業の進行を管理</text>
  <rect x="435" y="285" width="150" height="75" rx="8" fill="#e7e7e7" stroke="#777" stroke-width="1.6" />
  <text x="510.0" y="314" class="role">SKILL</text>
  <text x="510.0" y="342" class="body">手順書3本</text>
  <rect x="55" y="430" width="530" height="75" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="320.0" y="459" class="role">AIの作業画面</text>
  <text x="320.0" y="487" class="body">範囲指定・原寸比較・修正</text>
  <rect x="55" y="625" width="290" height="75" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="200.0" y="654" class="role">画像処理</text>
  <text x="200.0" y="682" class="body">マスクとトーンを作成</text>
  <rect x="415" y="625" width="170" height="75" rx="8" fill="white" stroke="#777" stroke-width="1.6" />
  <text x="500.0" y="654" class="role">作業データ</text>
  <text x="500.0" y="682" class="body">原稿・結果</text>
  <rect x="680" y="285" width="220" height="95" rx="8" fill="#e7e7e7" stroke="#777" stroke-width="1.6" />
  <text x="790.0" y="314" class="role">生成AI</text>
  <text x="790.0" y="342" class="body">Codex</text>
  <text x="790" y="411" class="label">入力の解釈・操作判断</text>
  <text x="790" y="439" class="label">画像からのプロンプト作成</text>
  <path d="M 290 72 V 148" class="arrow both" />
  <text x="435" y="98" class="label">原稿・見本・指示／結果</text>
  <path d="M 220 227 V 283" class="arrow both" />
  <text x="325" y="261" class="label">依頼／結果</text>
  <path d="M 433 322 H 387" class="arrow" stroke-dasharray="6 4" />
  <text x="410" y="303" class="label">参照</text>
  <path d="M 387 350 H 410 V 390 H 790 V 382" class="arrow both" />
  <path d="M 220 362 V 428" class="arrow both" />
  <text x="335" y="400" class="label">操作／画面画像</text>
  <path d="M 200 507 V 623" class="arrow both" />
  <text x="386" y="573" class="label">範囲指定／マスク・仕上げ</text>
  <path d="M 347 662 H 413" class="arrow both" />
</svg>
